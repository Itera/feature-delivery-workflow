name: intent-to-merge
version: "1.0"
description: 'Pass task_id explicitly (e.g. the intent file basename); it defaults to "intent". Generic intent-driven dev loop: branch -> implement -> test -> review -> validate -> conditional merge, from a single intent markdown file.'
metadata:
    team_id: team-1791906795-ce1d1a69
    generated_at: "2026-10-13T17:53:55+02:00"
    schema_version: "1.0"
    generated_by: digital-factory/workflow_export
variables:
    base_branch: main
    branch_slug: ""
    intent_file: ""
    repo_path: ""
    task_id: intent
    attempt: "1"
agents:
    - id: tester
      type: tester
      name: tester
      runtime: copilot
      model: claude-sonnet-5.5
      prompt: '@file:prompts/intent-to-merge/tester.md'
      permissions:
        mode: bypassPermissions
    - id: implementer
      type: coder
      name: implementer
      runtime: copilot
      model: claude-sonnet-5.5
      prompt: '@file:prompts/intent-to-merge/implementer.md'
      permissions:
        mode: bypassPermissions
    - id: reviewer
      type: reviewer
      name: reviewer
      runtime: copilot
      model: claude-sonnet-5.5
      prompt: '@file:prompts/intent-to-merge/reviewer.md'
      permissions:
        mode: acceptEdits
        allowed_tools:
            - Read
            - Grep
            - Glob
            - Bash(git diff:*)
            - Bash(git status:*)
            - Bash(git log:*)
            - Bash(git show:*)
            - Bash(scripts/task-state.js:*)
        denied_tools:
            - Write
            - Edit
    - id: validator
      type: tester
      name: validator
      runtime: copilot
      model: claude-sonnet-5.5
      prompt: '@file:prompts/intent-to-merge/validator.md'
      permissions:
        # bypass: needs arbitrary build/run/probe commands. Tool denies would be ignored under copilot
        # bypass; the real control is snapshot-before-validate + gate-validate (tamper guard).
        mode: bypassPermissions
    - id: reporter
      type: specialist
      name: reporter
      runtime: copilot
      model: claude-haiku-4.5
      # runtime: copilot passes only this prompt to the agent, not the task description, so each
      # agent gets exactly one job. Branch/merge are deterministic command tasks (scripts/intent-git.sh).
      prompt: '@file:prompts/intent-to-merge/reporter.md'
      permissions:
        mode: acceptEdits
        allowed_tools:
            - Read
            - Bash(scripts/task-state.js:*)
            - Bash(cd:*)
        denied_tools:
            - Write
            - Edit
tasks:
    - id: report
      name: report
      description: 'Report the outcome of intent ${task_id} from the state file, following your prompt.'
      type: standard
      agent: reporter
      depends_on:
        - test
        - review
        - validate
        - merge
    - id: gate-test
      name: gate-test
      type: command
      parameters:
        command: '[ -n "${repo_path}" ] && cd "${repo_path}" && [ "$(git branch --show-current)" = "feature/${branch_slug}" ] && { v=$(scripts/task-state.js get "${task_id}" verdicts.tester 2>/dev/null); a=$(scripts/task-state.js get "${task_id}" verdicts.tester_attempt 2>/dev/null); [ "$a" = "${attempt}" ] && printf %s "$v"; }; true'
      depends_on:
        - test
    - id: gate-review
      name: gate-review
      type: command
      parameters:
        command: '[ -n "${repo_path}" ] && cd "${repo_path}" && { v=$(scripts/task-state.js get "${task_id}" verdicts.reviewer 2>/dev/null); a=$(scripts/task-state.js get "${task_id}" verdicts.reviewer_attempt 2>/dev/null); [ "$a" = "${attempt}" ] && { [ "$v" != CLEAR ] || { g="${tasks.snapshot-before-review.output?}"; set -- $g; r=$2; [ -n "$r" ] || r=HEAD; s=$(git show "$r:scripts/intent-git.sh") && [ -n "$s" ] && bash -c "$s" intent-git.sh verify "${task_id}" "${branch_slug}" "${base_branch}" "$1" "$2" reviewer >&2; }; } && [ "$(git branch --show-current)" = "feature/${branch_slug}" ] && printf %s "$v"; }; true'
      depends_on:
        - review
        - snapshot-before-review
    - id: snapshot-before-review
      name: snapshot-before-review
      # Tamper guard for the reviewer: copilot collapses its Bash(git diff:*)-style allows to all of git.
      # Same mechanism as snapshot-before-validate; gate-review rejects a CLEAR if HEAD or the tree changed.
      type: command
      parameters:
        command: '[ -n "${repo_path}" ] && cd "${repo_path}" && h=$(git rev-parse HEAD) && s=$(git show "$h:scripts/intent-git.sh") && [ -n "$s" ] && bash -c "$s" intent-git.sh snapshot "${task_id}" "${branch_slug}" "${base_branch}"'
      when: "${tasks.gate-test.output?} == GREEN"
      depends_on:
        - gate-test
    - id: gate-validate
      name: gate-validate
      type: command
      parameters:
        command: '[ -n "${repo_path}" ] && cd "${repo_path}" && { v=$(scripts/task-state.js get "${task_id}" verdicts.validator 2>/dev/null); a=$(scripts/task-state.js get "${task_id}" verdicts.validator_attempt 2>/dev/null); [ "$a" = "${attempt}" ] && { [ "$v" != PASS ] || { g="${tasks.snapshot-before-validate.output?}"; set -- $g; r=$2; [ -n "$r" ] || r=HEAD; s=$(git show "$r:scripts/intent-git.sh") && [ -n "$s" ] && bash -c "$s" intent-git.sh verify "${task_id}" "${branch_slug}" "${base_branch}" "$1" "$2" validator >&2; }; } && [ "$(git branch --show-current)" = "feature/${branch_slug}" ] && printf %s "$v"; }; true'
      depends_on:
        - validate
        - snapshot-before-validate
        - cleanup-after-validate
    - id: cleanup-after-validate
      name: cleanup-after-validate
      # Backstop for the validator: stop dev servers it recorded in .task-state/pids-<task_id> but left
      # running (crash/timeout). Only kills PIDs whose cwd is inside the repo. branch does the same for all ids.
      type: command
      parameters:
        command: '[ -n "${repo_path}" ] && cd "${repo_path}" && scripts/intent-git.sh cleanup "${task_id}" "${branch_slug}" "${base_branch}"'
      depends_on:
        - validate
    - id: snapshot-before-validate
      name: snapshot-before-validate
      # Tamper guard: the validator runs bypassPermissions, where copilot ignores tool denies.
      # Outputs "<tree> <head>"; gate-validate passes it to verify and rejects a PASS if HEAD moved or
      # the working tree changed. Both steps run the committed script (git show <head>:...), and the
      # snapshot lives only in the engine's task output, so the validator can't forge either.
      type: command
      parameters:
        command: '[ -n "${repo_path}" ] && cd "${repo_path}" && h=$(git rev-parse HEAD) && s=$(git show "$h:scripts/intent-git.sh") && [ -n "$s" ] && bash -c "$s" intent-git.sh snapshot "${task_id}" "${branch_slug}" "${base_branch}"'
      when: "${tasks.gate-review.output?} == CLEAR"
      depends_on:
        - gate-review
    - id: merge
      name: merge
      type: command
      parameters:
        command: '[ -n "${repo_path}" ] && cd "${repo_path}" && scripts/intent-git.sh merge "${task_id}" "${branch_slug}" "${base_branch}"'
      when: "${tasks.gate-validate.output?} == PASS"
      depends_on:
        - gate-validate
    - id: validate
      name: validate
      description: Verify each Success Metric in ${intent_file} is met in ${repo_path}; write the verdict (PASS or FAIL) to verdicts.validator in the state file (the gate reads it there), then output exactly that token.
      type: standard
      agent: validator
      when: "${tasks.gate-review.output?} == CLEAR"
      depends_on:
        - gate-review
        - snapshot-before-validate
    - id: review
      name: review
      description: Review the diff of feature/${branch_slug} against ${intent_file}; write the verdict (CLEAR, P1 or P0) to verdicts.reviewer in the state file (the gate reads it there), then output exactly that token.
      type: standard
      agent: reviewer
      when: "${tasks.gate-test.output?} == GREEN"
      depends_on:
        - gate-test
        - snapshot-before-review
    - id: test
      name: test
      description: Run build/lint/test for ${repo_path} and write the verdict (GREEN, BUILD_FAIL or TEST_FAIL) to verdicts.tester in the state file (the gate reads it there), then output exactly that token.
      type: standard
      agent: tester
      depends_on:
        - implement
    - id: implement
      name: implement
      description: Implement every success metric of the intent at ${intent_file} in ${repo_path} on branch feature/${branch_slug}, following your prompt.
      type: standard
      agent: implementer
      depends_on:
        - branch
    - id: branch
      name: branch
      type: command
      parameters:
        command: '[ -n "${repo_path}" ] && cd "${repo_path}" && scripts/intent-git.sh branch "${task_id}" "${branch_slug}" "${base_branch}"'
settings:
    max_concurrency: 1
    timeout: 90m0s
    failure_policy: fail-fast
    cwd: ${repo_path}
    permissions:
        # Ceiling, not default: agents cannot escalate above it. implementer/tester/validator
        # need unattended arbitrary build/run commands; reporter and reviewer narrow themselves.
        mode: bypassPermissions
        # runtime: copilot (verified 2026-10-20): bypassPermissions agents get --allow-all-tools and NO
        # deny flags, so this list only applies to acceptEdits agents (reporter, reviewer). Copilot
        # cannot express sub-arguments: Bash(git push --force:*) collapses to deny shell(git:*), which
        # blocks ALL git for those agents. Keep only rules whose first word is safe to deny outright;
        # git-safety rules for bypass agents live in their prompts.
        # Effective only for the acceptEdits agents (reviewer, reporter); copilot denies whole commands.
        denied_tools:
            - Bash(rm:*)
            - Bash(sudo:*)
