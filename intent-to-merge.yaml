name: intent-to-merge
version: "1.0"
description: 'Pass task_id explicitly (e.g. the intent file basename); it defaults to "intent". Generic intent-driven dev loop: branch -> implement -> test -> review -> validate -> conditional merge, from a single intent markdown file.'
metadata:
    team_id: team-1791906795-ce1d1a69
    generated_at: "2026-10-13T17:53:55+02:00"
    schema_version: "1.0"
    generated_by: digital-factory/workflow_export
variables:
    base_branch: main
    branch_slug: ""
    intent_file: ""
    repo_path: ""
    task_id: intent
    attempt: "1"
agents:
    - id: agent-team-1791906795-ce1d1a69-tester-5
      type: tester
      name: tester
      runtime: copilot
      model: claude-haiku-4.5
      prompt: '@file:prompts/intent-to-merge/tester.md'
      permissions:
        mode: bypassPermissions
    - id: agent-team-1791906795-ce1d1a69-coder-2
      type: coder
      name: implementer
      runtime: copilot
      model: claude-sonnet-5.5
      prompt: '@file:prompts/intent-to-merge/implementer.md'
      permissions:
        mode: bypassPermissions
    - id: agent-team-1791906795-ce1d1a69-reviewer-3
      type: reviewer
      name: reviewer
      runtime: copilot
      model: claude-sonnet-5.5
      prompt: '@file:prompts/intent-to-merge/reviewer.md'
      permissions:
        mode: acceptEdits
        allowed_tools:
            - Read
            - Grep
            - Glob
            - Bash(git diff:*)
            - Bash(git status:*)
            - Bash(git log:*)
            - Bash(git show:*)
            - Bash(scripts/task-state.js:*)
        denied_tools:
            - Write
            - Edit
    - id: agent-team-1791906795-ce1d1a69-tester-4
      type: tester
      name: validator
      runtime: copilot
      model: claude-sonnet-5.5
      prompt: '@file:prompts/intent-to-merge/validator.md'
      permissions:
        mode: bypassPermissions
        denied_tools:
            - Write
            - Edit
    - id: agent-team-1791906795-ce1d1a69-specialist-1
      type: specialist
      name: reporter
      runtime: copilot
      model: claude-haiku-4.5
      # runtime: copilot passes only this prompt to the agent, not the task description, so each
      # agent gets exactly one job. Branch/merge are deterministic command tasks (scripts/intent-git.sh).
      prompt: '@file:prompts/intent-to-merge/reporter.md'
      permissions:
        mode: acceptEdits
        allowed_tools:
            - Read
            - Bash(scripts/task-state.js:*)
            - Bash(cd:*)
        denied_tools:
            - Write
            - Edit
tasks:
    - id: task-report-outcome
      name: report-final-outcome
      description: 'Report the outcome of intent ${task_id} from the state file, following your prompt.'
      type: standard
      agent: agent-team-1791906795-ce1d1a69-specialist-1
      depends_on:
        - task-team-1791906795-ce1d1a69-1791906824-25d1e6
        - task-team-1791906795-ce1d1a69-1791906826-55d07d
        - task-team-1791906795-ce1d1a69-1791906829-499dfe
        - task-team-1791906795-ce1d1a69-1791906831-70759d
    - id: gate-test
      name: gate-test
      action: command
      parameters:
        command: '[ -n "${repo_path}" ] && cd "${repo_path}" && [ "$(git branch --show-current)" = "feature/${branch_slug}" ] && { v=$(scripts/task-state.js get "${task_id}" verdicts.tester 2>/dev/null); a=$(scripts/task-state.js get "${task_id}" verdicts.tester_attempt 2>/dev/null); [ "$a" = "${attempt}" ] && printf %s "$v"; }; true'
      depends_on:
        - task-team-1791906795-ce1d1a69-1791906824-25d1e6
    - id: gate-review
      name: gate-review
      action: command
      parameters:
        command: '[ -n "${repo_path}" ] && cd "${repo_path}" && [ "$(git branch --show-current)" = "feature/${branch_slug}" ] && { v=$(scripts/task-state.js get "${task_id}" verdicts.reviewer 2>/dev/null); a=$(scripts/task-state.js get "${task_id}" verdicts.reviewer_attempt 2>/dev/null); [ "$a" = "${attempt}" ] && printf %s "$v"; }; true'
      depends_on:
        - task-team-1791906795-ce1d1a69-1791906826-55d07d
    - id: gate-validate
      name: gate-validate
      action: command
      parameters:
        command: '[ -n "${repo_path}" ] && cd "${repo_path}" && [ "$(git branch --show-current)" = "feature/${branch_slug}" ] && { v=$(scripts/task-state.js get "${task_id}" verdicts.validator 2>/dev/null); a=$(scripts/task-state.js get "${task_id}" verdicts.validator_attempt 2>/dev/null); [ "$a" = "${attempt}" ] && { [ "$v" != PASS ] || scripts/intent-git.sh verify "${task_id}" "${branch_slug}" "${base_branch}" >&2; } && printf %s "$v"; }; true'
      depends_on:
        - task-team-1791906795-ce1d1a69-1791906829-499dfe
    - id: snapshot-before-validate
      name: snapshot-before-validate
      # Tamper guard: the validator runs bypassPermissions, where copilot ignores its Write/Edit denies.
      # gate-validate rejects a PASS if the working tree changed after this snapshot.
      action: command
      parameters:
        command: '[ -n "${repo_path}" ] && cd "${repo_path}" && scripts/intent-git.sh snapshot "${task_id}" "${branch_slug}" "${base_branch}"'
      when: "${tasks.gate-review.output?} == CLEAR"
      depends_on:
        - gate-review
    - id: task-team-1791906795-ce1d1a69-1791906831-70759d
      name: merge
      action: command
      parameters:
        command: '[ -n "${repo_path}" ] && cd "${repo_path}" && scripts/intent-git.sh merge "${task_id}" "${branch_slug}" "${base_branch}"'
      when: "${tasks.gate-validate.output?} == PASS"
      depends_on:
        - gate-validate
    - id: task-team-1791906795-ce1d1a69-1791906829-499dfe
      name: verify-each-success-metric-in-intent-file-is-met
      description: Verify each Success Metric in ${intent_file} is met in ${repo_path}; write the verdict (PASS or FAIL) to verdicts.validator in the state file (the gate reads it there), then output exactly that token.
      type: standard
      agent: agent-team-1791906795-ce1d1a69-tester-4
      when: "${tasks.gate-review.output?} == CLEAR"
      depends_on:
        - gate-review
        - snapshot-before-validate
    - id: task-team-1791906795-ce1d1a69-1791906826-55d07d
      name: review-the-diff-of-featurebranch-slug-against
      description: Review the diff of feature/${branch_slug} against ${intent_file}; write the verdict (CLEAR, P1 or P0) to verdicts.reviewer in the state file (the gate reads it there), then output exactly that token.
      type: standard
      agent: agent-team-1791906795-ce1d1a69-reviewer-3
      when: "${tasks.gate-test.output?} == GREEN"
      depends_on:
        - gate-test
    - id: task-team-1791906795-ce1d1a69-1791906824-25d1e6
      name: run-buildlinttest-for-repo-path-and-output
      description: Run build/lint/test for ${repo_path} and write the verdict (GREEN, BUILD_FAIL or TEST_FAIL) to verdicts.tester in the state file (the gate reads it there), then output exactly that token.
      type: standard
      agent: agent-team-1791906795-ce1d1a69-tester-5
      depends_on:
        - task-team-1791906795-ce1d1a69-1791906822-14cee3
    - id: task-team-1791906795-ce1d1a69-1791906822-14cee3
      name: implement-every-success-metric-of-the-intent-at
      description: Implement every success metric of the intent at ${intent_file} in ${repo_path} on branch feature/${branch_slug}, following your prompt.
      type: standard
      agent: agent-team-1791906795-ce1d1a69-coder-2
      depends_on:
        - task-team-1791906795-ce1d1a69-1791906820-e47692
    - id: task-team-1791906795-ce1d1a69-1791906820-e47692
      name: branch
      action: command
      parameters:
        command: '[ -n "${repo_path}" ] && cd "${repo_path}" && scripts/intent-git.sh branch "${task_id}" "${branch_slug}" "${base_branch}"'
settings:
    max_concurrency: 1
    timeout: 90m0s
    failure_policy: fail-fast
    cwd: ${repo_path}
    permissions:
        # Ceiling, not default: agents cannot escalate above it. implementer/tester/validator
        # need unattended arbitrary build/run commands; reporter and reviewer narrow themselves.
        mode: bypassPermissions
        # runtime: copilot (verified 2026-10-20): bypassPermissions agents get --allow-all-tools and NO
        # deny flags, so this list only applies to acceptEdits agents (reporter, reviewer). Copilot
        # cannot express sub-arguments: Bash(git push --force:*) collapses to deny shell(git:*), which
        # blocks ALL git for those agents. Keep only rules whose first word is safe to deny outright;
        # git-safety rules for bypass agents live in their prompts.
        denied_tools:
            - Bash(rm -rf:*)
            - Bash(sudo:*)
