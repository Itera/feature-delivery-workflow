name: sdlc
version: "1.0"
description: 'Pass task_id explicitly (e.g. the intent file basename); it defaults to "intent". Generic intent-driven dev loop: branch -> implement -> test -> review -> validate -> conditional merge, from a single intent markdown file.'
metadata:
    stages:
        - name: Setup
          tasks: [branch, snapshot-before-tests]
        - name: Acceptance tests
          tasks: [write-tests, lock-tests]
        - name: Implement
          tasks: [implement]
        - name: Test gate
          tasks: [run-tests, summarise-test-failure, gate-test]
        - name: Review
          tasks: [snapshot-before-review, review, gate-review]
        - name: Validate
          tasks: [snapshot-before-validate, validate, cleanup-after-validate, gate-validate]
        - name: Merge
          tasks: [merge]
        - name: Report
          tasks: [report]
    team_id: team-1791906795-ce1d1a69
    generated_at: "2026-10-13T17:53:55+02:00"
    schema_version: "1.0"
    generated_by: digital-factory/workflow_export
variables:
    base_branch: main
    branch_slug: ""
    intent_file: ""
    repo_path: ""
    task_id: intent
    attempt: "1"
    # Hash of git hooks/config taken by the orchestrator before the run (intent-git.sh git-meta); empty =
    # snapshot-before-tests takes it. Every later step stops the run if hooks or config changed since.
    git_meta: ""
    # Intent files guard: the intents folder and the hash of its files, taken by the orchestrator before the run
    # (intent-git.sh plan-hash); merge refuses if they changed. Empty = no check.
    intents_dir: ""
    plan_hash: ""
    # Fixed test gate, run from the repo root with sh -c; its exit code is the test verdict. Passed
    # verbatim through a quoted heredoc, so any quoting is fine (single line only). Set it per project
    # (e.g. `npm test`, `pytest`); the default assumes npm.
    test_command: npm test
    # Build check of the test gate, run before test_command (always both) the same way, e.g. `npm run build`
    # (with a type check). Empty = no build check. Its failure is BUILD_FAIL, or ACCEPTANCE_TESTS_BUILD_FAIL
    # when only acceptance test files break it (fixed by the test author; the attempt is not counted).
    build_command: ""
agents:
    - id: test-author
      type: tester
      name: test-author
      runtime: copilot
      # Different model family from the implementer/reviewer, so tests don't share their blind spots.
      model: gpt-5.3-codex
      prompt: '@file:prompts/test-author.md'
      permissions:
        # bypass: must run the test runner. It may only write *.acceptance.test.* files; enforced by
        # snapshot-before-tests + lock-tests (tool denies are not enforced under copilot bypass).
        mode: bypassPermissions
    - id: tester
      type: tester
      name: tester
      runtime: copilot
      model: claude-sonnet-5.5
      # Only summarises a failed run-tests log into feedback.tester; the verdict is the command's exit code.
      prompt: '@file:prompts/tester.md'
      permissions:
        mode: acceptEdits
        allowed_tools:
            - Read
            - Grep
            - Glob
            - Bash(.intent-loop/scripts/task-state.js:*)
        denied_tools:
            - Write
            - Edit
    - id: implementer
      type: coder
      name: implementer
      runtime: copilot
      model: claude-sonnet-5.5
      prompt: '@file:prompts/implementer.md'
      permissions:
        mode: bypassPermissions
    - id: reviewer
      type: reviewer
      name: reviewer
      runtime: copilot
      # Different model family from the implementer, so the review doesn't share its blind spots.
      model: gpt-5.6-terra
      prompt: '@file:prompts/reviewer.md'
      permissions:
        mode: acceptEdits
        allowed_tools:
            - Read
            - Grep
            - Glob
            - Bash(git diff:*)
            - Bash(git status:*)
            - Bash(git log:*)
            - Bash(git show:*)
            - Bash(.intent-loop/scripts/task-state.js:*)
        denied_tools:
            - Write
            - Edit
    - id: validator
      type: tester
      name: validator
      runtime: copilot
      model: claude-sonnet-5.5
      prompt: '@file:prompts/validator.md'
      permissions:
        # bypass: needs arbitrary build/run/probe commands. Tool denies would be ignored under copilot
        # bypass; the real control is snapshot-before-validate + gate-validate (tamper guard).
        mode: bypassPermissions
    - id: reporter
      type: specialist
      name: reporter
      runtime: copilot
      model: claude-haiku-4.5
      # runtime: copilot passes only this prompt to the agent, not the task description, so each
      # agent gets exactly one job. Branch/merge are deterministic command tasks (.intent-loop/scripts/intent-git.sh).
      prompt: '@file:prompts/reporter.md'
      permissions:
        mode: acceptEdits
        allowed_tools:
            - Read
            - Bash(.intent-loop/scripts/task-state.js:*)
            - Bash(cd:*)
        denied_tools:
            - Write
            - Edit
tasks:
    - id: report
      name: report
      description: 'Report the outcome of intent ${task_id} from the state file, following your prompt.'
      type: standard
      agent: reporter
      depends_on:
        - gate-test
        - gate-review
        - gate-validate
        - merge
    - id: gate-test
      name: gate-test
      # GREEN only if run-tests (engine-held output) was GREEN, the acceptance tests and the test setup
      # (package.json test scripts, runner config) still match the hashes from lock-tests, and we are on
      # the feature branch.
      type: command
      parameters:
        command: |
          [ -n "${repo_path}" ] && cd "${repo_path}" && mkdir -p .task-state || exit 1
          exec 2>>".task-state/gates-${task_id}.log"
          set -- ${tasks.snapshot-before-tests.output?}
          export INTENT_TRUST="$3" INTENT_STATE_HASH="$4" INTENT_META="$5"
          [ -n "$INTENT_TRUST" ] && s=$(git show "$INTENT_TRUST:.intent-loop/scripts/intent-git.sh") && [ -n "$s" ] || { echo "no trusted intent-git.sh (snapshot: $*)" >&2; exit 0; }
          r=$(printf %s "${tasks.run-tests.output?}"); l=$(printf %s "${tasks.lock-tests.output?}")
          bash -c "$s" intent-git.sh check-tests "${task_id}" "${branch_slug}" "${base_branch}" "$l" "$r" >&2 && [ "$(git branch --show-current)" = "feature/${branch_slug}" ] && [ "$r" = GREEN ] && printf GREEN
          true
      depends_on:
        - run-tests
        - summarise-test-failure
        - lock-tests
        - snapshot-before-tests
    - id: gate-review
      name: gate-review
      type: command
      parameters:
        command: |
          [ -n "${repo_path}" ] && cd "${repo_path}" && mkdir -p .task-state || exit 1
          exec 2>>".task-state/gates-${task_id}.log"
          set -- ${tasks.snapshot-before-review.output?}
          export INTENT_TRUST="$3" INTENT_STATE_HASH="$4" INTENT_META="$5"
          [ -n "$INTENT_TRUST" ] && s=$(git show "$INTENT_TRUST:.intent-loop/scripts/intent-git.sh") && [ -n "$s" ] || { echo "no trusted intent-git.sh (snapshot: $*)" >&2; exit 0; }
          bash -c "$s" intent-git.sh gate "${task_id}" "${branch_slug}" "${base_branch}" reviewer "${attempt}" "$1" "$2"
          true
      depends_on:
        - review
        - snapshot-before-review
    - id: snapshot-before-review
      name: snapshot-before-review
      # Tamper guard for the reviewer: copilot collapses its Bash(git diff:*)-style allows to all of git.
      # Same mechanism as snapshot-before-validate; gate-review rejects a CLEAR if HEAD or the tree changed.
      type: command
      parameters:
        command: |
          [ -n "${repo_path}" ] && cd "${repo_path}" && mkdir -p .task-state || exit 1
          exec 2>>".task-state/gates-${task_id}.log"
          set -- ${tasks.snapshot-before-tests.output?}
          export INTENT_TRUST="$3" INTENT_STATE_HASH="$4" INTENT_META="$5"
          [ -n "$INTENT_TRUST" ] && s=$(git show "$INTENT_TRUST:.intent-loop/scripts/intent-git.sh") && [ -n "$s" ] || { echo "no trusted intent-git.sh (snapshot: $*)" >&2; exit 1; }
          bash -c "$s" intent-git.sh snapshot "${task_id}" "${branch_slug}" "${base_branch}"
      when: "${tasks.gate-test.output?} == GREEN"
      depends_on:
        - snapshot-before-tests
        - gate-test
    - id: gate-validate
      name: gate-validate
      type: command
      parameters:
        command: |
          [ -n "${repo_path}" ] && cd "${repo_path}" && mkdir -p .task-state || exit 1
          exec 2>>".task-state/gates-${task_id}.log"
          set -- ${tasks.snapshot-before-validate.output?}
          export INTENT_TRUST="$3" INTENT_STATE_HASH="$4" INTENT_META="$5"
          [ -n "$INTENT_TRUST" ] && s=$(git show "$INTENT_TRUST:.intent-loop/scripts/intent-git.sh") && [ -n "$s" ] || { echo "no trusted intent-git.sh (snapshot: $*)" >&2; exit 0; }
          bash -c "$s" intent-git.sh gate "${task_id}" "${branch_slug}" "${base_branch}" validator "${attempt}" "$1" "$2"
          true
      depends_on:
        - validate
        - snapshot-before-validate
        - cleanup-after-validate
    - id: cleanup-after-validate
      name: cleanup-after-validate
      # Backstop for the validator: stop dev servers it recorded in .task-state/pids-<task_id> but left
      # running (crash/timeout). Only kills PIDs whose cwd is inside the repo. branch does the same for all ids.
      type: command
      parameters:
        command: |
          [ -n "${repo_path}" ] && cd "${repo_path}" && mkdir -p .task-state || exit 1
          set -- ${tasks.snapshot-before-validate.output?}
          export INTENT_TRUST="$3" INTENT_STATE_HASH="$4" INTENT_META="$5"
          [ -n "$INTENT_TRUST" ] && s=$(git show "$INTENT_TRUST:.intent-loop/scripts/intent-git.sh") && [ -n "$s" ] || { echo "no trusted intent-git.sh (snapshot: $*)" >&2; exit 0; }
          bash -c "$s" intent-git.sh cleanup "${task_id}" "${branch_slug}" "${base_branch}"
      depends_on:
        - snapshot-before-validate
        - validate
    - id: snapshot-before-validate
      name: snapshot-before-validate
      # Tamper guard: the validator runs bypassPermissions, where copilot ignores tool denies.
      # Outputs "<tree> <head>"; gate-validate passes it to verify and rejects a PASS if HEAD moved or
      # the working tree changed. Both steps run the trusted script (git show <trust>:...), and the
      # snapshot lives only in the engine's task output, so the validator can't forge either.
      type: command
      parameters:
        command: |
          [ -n "${repo_path}" ] && cd "${repo_path}" && mkdir -p .task-state || exit 1
          exec 2>>".task-state/gates-${task_id}.log"
          set -- ${tasks.snapshot-before-review.output?}
          export INTENT_TRUST="$3" INTENT_STATE_HASH="$4" INTENT_META="$5"
          [ -n "$INTENT_TRUST" ] && s=$(git show "$INTENT_TRUST:.intent-loop/scripts/intent-git.sh") && [ -n "$s" ] || { echo "no trusted intent-git.sh (snapshot: $*)" >&2; exit 1; }
          bash -c "$s" intent-git.sh snapshot "${task_id}" "${branch_slug}" "${base_branch}"
      when: "${tasks.gate-review.output?} == CLEAR"
      depends_on:
        - snapshot-before-review
        - gate-review
    - id: merge
      name: merge
      type: command
      parameters:
        command: |
          [ -n "${repo_path}" ] && cd "${repo_path}" && mkdir -p .task-state || exit 1
          set -- ${tasks.snapshot-before-validate.output?}
          export INTENT_PLAN_DIR="${intents_dir}" INTENT_PLAN_HASH="${plan_hash}"
          export INTENT_TRUST="$3" INTENT_STATE_HASH="$4" INTENT_META="$5"
          [ -n "$INTENT_TRUST" ] && s=$(git show "$INTENT_TRUST:.intent-loop/scripts/intent-git.sh") && [ -n "$s" ] || { echo "no trusted intent-git.sh (snapshot: $*)" >&2; exit 1; }
          bash -c "$s" intent-git.sh merge "${task_id}" "${branch_slug}" "${base_branch}"
      when: "${tasks.gate-validate.output?} == PASS"
      depends_on:
        - snapshot-before-validate
        - gate-validate
    - id: validate
      name: validate
      description: Verify each Success Metric in ${intent_file} is met in ${repo_path}; write the verdict (PASS or FAIL) to verdicts.validator in the state file (the gate reads it there), then output exactly that token.
      type: standard
      agent: validator
      when: "${tasks.gate-review.output?} == CLEAR"
      depends_on:
        - gate-review
        - snapshot-before-validate
    - id: review
      name: review
      description: Review the diff of feature/${branch_slug} against ${intent_file}; write the verdict (CLEAR, P1 or P0) to verdicts.reviewer in the state file (the gate reads it there), then output exactly that token.
      type: standard
      agent: reviewer
      when: "${tasks.gate-test.output?} == GREEN"
      depends_on:
        - gate-test
        - snapshot-before-review
    - id: run-tests
      name: run-tests
      # Deterministic test gate (replaces an LLM verdict): runs ${build_command} (if set) and ${test_command}, records
      # the verdict (GREEN|TEST_FAIL|BUILD_FAIL|ACCEPTANCE_TESTS_BUILD_FAIL) and prints GREEN|TEST_GATE_FAIL|NOT_RUN.
      # No when: on purpose. It prints NOT_RUN unless the implementer finished this attempt, and gate-test
      # reads its output: the engine fails the read of a when-skipped task even with the ?-suffix.
      type: command
      parameters:
        command: |
          [ -n "${repo_path}" ] && cd "${repo_path}" && mkdir -p .task-state || exit 1
          exec 2>>".task-state/gates-${task_id}.log"
          set -- ${tasks.snapshot-before-tests.output?}
          export INTENT_TRUST="$3" INTENT_STATE_HASH="$4" INTENT_META="$5"
          [ -n "$INTENT_TRUST" ] && s=$(git show "$INTENT_TRUST:.intent-loop/scripts/intent-git.sh") && [ -n "$s" ] || { echo "no trusted intent-git.sh (snapshot: $*)" >&2; exit 0; }
          # Quoted heredoc: test_command is passed verbatim (any quotes, $ or backticks).
          tc=$(cat <<'__INTENT_TEST_COMMAND__'
          ${test_command}
          __INTENT_TEST_COMMAND__
            )
          bc=$(cat <<'__INTENT_BUILD_COMMAND__'
          ${build_command}
          __INTENT_BUILD_COMMAND__
            )
          bash -c "$s" intent-git.sh run-tests "${task_id}" "${branch_slug}" "${base_branch}" "${attempt}" "$tc" "$bc"
          true
      depends_on:
        - implement
        - lock-tests
        - snapshot-before-tests
    - id: summarise-test-failure
      name: summarise-test-failure
      description: Summarise the failed test gate log into feedback.tester, following your prompt.
      type: standard
      agent: tester
      when: "${tasks.run-tests.output?} == TEST_GATE_FAIL"
      depends_on:
        - run-tests
    - id: snapshot-before-tests
      name: snapshot-before-tests
      # Fingerprint of everything except *.acceptance.test.*, taken before any agent runs. Output
      # "<tree> <head> <trust> <state_hash> <git_meta>": <trust> is the base branch commit right now; every later
      # command step runs .intent-loop/scripts/intent-git.sh (and task-state.js) from it, never from the working tree,
      # and passes it on through the review/validate snapshots. See "Trust" in .intent-loop/scripts/intent-git.sh.
      type: command
      parameters:
        command: |
          [ -n "${repo_path}" ] && cd "${repo_path}" && mkdir -p .task-state || exit 1
          exec 2>>".task-state/gates-${task_id}.log"
          export INTENT_META="${git_meta}"
          s=$(git show "${base_branch}:.intent-loop/scripts/intent-git.sh") && [ -n "$s" ] && bash -c "$s" intent-git.sh snapshot "${task_id}" "${branch_slug}" "${base_branch}" test_author
      depends_on:
        - branch
    - id: write-tests
      name: write-tests
      description: Write acceptance tests for the Success Metrics of ${intent_file}, following your prompt.
      type: standard
      agent: test-author
      depends_on:
        - snapshot-before-tests
    - id: lock-tests
      name: lock-tests
      # Rejects the test author's work if it changed anything but *.acceptance.test.* or wrote none for this
      # intent; otherwise prints the hash of all acceptance tests (empty output = implement is skipped).
      type: command
      parameters:
        command: |
          [ -n "${repo_path}" ] && cd "${repo_path}" && mkdir -p .task-state || exit 1
          exec 2>>".task-state/gates-${task_id}.log"
          set -- ${tasks.snapshot-before-tests.output?}
          export INTENT_TRUST="$3" INTENT_STATE_HASH="$4" INTENT_META="$5"
          [ -n "$INTENT_TRUST" ] && s=$(git show "$INTENT_TRUST:.intent-loop/scripts/intent-git.sh") && [ -n "$s" ] || { echo "no trusted intent-git.sh (snapshot: $*)" >&2; exit 0; }
          bash -c "$s" intent-git.sh lock-tests "${task_id}" "${branch_slug}" "${base_branch}" "$1" "$2" "${attempt}"
          true
      depends_on:
        - write-tests
        - snapshot-before-tests
    - id: implement
      name: implement
      description: Implement every success metric of the intent at ${intent_file} in ${repo_path} on branch feature/${branch_slug}, following your prompt.
      type: standard
      agent: implementer
      when: "${tasks.lock-tests.output?}"
      depends_on:
        - lock-tests
    - id: branch
      name: branch
      type: command
      parameters:
        command: |
          [ -n "${repo_path}" ] && cd "${repo_path}" || exit 1
          # Script and task-state.js from the committed base branch, never from the working tree.
          export INTENT_META="${git_meta}" INTENT_TRUST=$(git rev-parse "${base_branch}") && s=$(git show "$INTENT_TRUST:.intent-loop/scripts/intent-git.sh") && [ -n "$s" ] || { echo "BRANCH=FAILED .intent-loop/scripts/intent-git.sh is not committed on ${base_branch}"; exit 1; }
          bash -c "$s" intent-git.sh branch "${task_id}" "${branch_slug}" "${base_branch}"
# Command task output = stdout followed by stderr, so every task whose output is read by a when: or a
# later command sends stderr to .task-state/gates-<task_id>.log (diagnostics live there). Write only
# $name (not ${name}) for shell variables in commands: ${...} is the engine's interpolation syntax.
settings:
    max_concurrency: 1
    timeout: 90m0s
    failure_policy: fail-fast
    cwd: ${repo_path}
    permissions:
        # Ceiling, not default: agents cannot escalate above it. implementer/tester/validator
        # need unattended arbitrary build/run commands; reporter and reviewer narrow themselves.
        mode: bypassPermissions
        # runtime: copilot (verified 2026-10-20): bypassPermissions agents get --allow-all-tools and NO
        # deny flags, so this list only applies to acceptEdits agents (reporter, reviewer). Copilot
        # cannot express sub-arguments: Bash(git push --force:*) collapses to deny shell(git:*), which
        # blocks ALL git for those agents. Keep only rules whose first word is safe to deny outright;
        # git-safety rules for bypass agents live in their prompts.
        # Effective only for the acceptEdits agents (reviewer, reporter); copilot denies whole commands.
        denied_tools:
            - Bash(rm:*)
            - Bash(sudo:*)
